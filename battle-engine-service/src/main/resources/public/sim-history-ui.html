<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Simulation History</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1b2029;
      --panel-strong: #242b36;
      --border: #394150;
      --text: #edf1f7;
      --muted: #aeb7c5;
      --accent: #59b4d8;
      --danger: #f06c64;
      --field: #0d1016;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: #171b22;
    }

    .header-inner,
    main {
      width: calc(100% - 32px);
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      font-size: 22px;
    }

    h2 {
      font-size: 16px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    main {
      display: grid;
      gap: 16px;
      padding: 20px 0 32px;
    }

    section {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--panel-strong);
      border-bottom: 1px solid var(--border);
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #071016;
      padding: 7px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    button.secondary,
    .button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .button:hover {
      text-decoration: none;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .table-scroll {
      max-width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--field);
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 9px 10px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #131820;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    @media (max-width: 640px) {
      .header-inner,
      main {
        width: calc(100% - 20px);
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-title">
        <h1>Simulation History</h1>
        <a href="/sim-ui">Simulator</a>
      </div>
      <div class="header-actions">
        <button id="import-button" class="secondary" type="button">Import</button>
        <button id="export-button" class="secondary" type="button">Export</button>
        <div id="status" class="status" role="status"></div>
      </div>
      <input id="import-file-input" type="file" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <main>
    <section>
      <div class="section-header">
        <h2>Past Simulations</h2>
        <div class="pager">
          <button id="previous-button" class="secondary" type="button">Previous</button>
          <span id="page-label"></span>
          <button id="next-button" class="secondary" type="button">Next</button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>Seed</th>
              <th>Attacker Losses</th>
              <th>Defender Losses</th>
              <th>Debris</th>
              <th>Plunder</th>
              <th>Elapsed</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/sim-history-ui.js"></script>
</body>
</html>
