plugins {
  id 'org.jetbrains.kotlin.jvm'
  id 'application'
}

group = 'com.github.retro_game'
version = rootProject.version
description = 'Retro Game Battle Engine Service'

kotlin {
  jvmToolchain(21)
}

dependencies {
  implementation project(':battle-engine')
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.20.1'
  implementation 'io.javalin:javalin:6.7.0'
  implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
  runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
  testImplementation 'io.mockk:mockk:1.14.11'
  testImplementation 'org.jetbrains.kotlin:kotlin-test'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
}

application {
  mainClass = 'com.github.retro_game.retro_game.battleengineservice.BattleEngineServiceApplicationKt'
}

def nativeBattleEngineDir = project(':battle-engine').layout.buildDirectory.dir('native')

tasks.withType(JavaExec).configureEach {
  dependsOn ':battle-engine:buildBattleEngine'
  jvmArgs "-Djava.library.path=${nativeBattleEngineDir.get().asFile.absolutePath}"
}

tasks.named('test') {
  useJUnitPlatform()
}
