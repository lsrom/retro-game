# Items
# Description are taken from http://ogame.wikia.com/wiki/Main_Page
# Buildings
items.METAL_MINE.name=Metal Mine
items.METAL_MINE.description=Metal is the primary resource used in the foundation of your Empire. At greater depths, the mines can produce more output of viable metal for use in the construction of buildings, ships, defense systems, and research. As the mines drill deeper, more energy is required for maximum production. As metal is the most abundant of all resources available, its value is considered to be the lowest of all resources for trading.
items.CRYSTAL_MINE.name=Crystal Mine
items.CRYSTAL_MINE.description=Crystal mines supply the main resource used to produce electronic circuits and form certain alloy compounds. Mining crystal consumes some one and a half times more energy than mining metal, making crystal more valuable. Almost all ships and all buildings require crystal. Most crystals required to build spaceships, however, are very rare, and like metal can only be found at a certain depth. Therefore, building mines in deeper strata will increase the amount of crystal produced.
items.DEUTERIUM_SYNTHESIZER.name=Deuterium Synthesizer
items.DEUTERIUM_SYNTHESIZER.description=Deuterium is also called heavy hydrogen. It is a stable isotope of hydrogen with a natural abundance in the oceans of colonies of approximately one atom in 6500 of hydrogen (~154 PPM). Deuterium thus accounts for approximately 0.015% (on a weight basis, 0.030%) of all. Deuterium is processed by special synthesizers which can separate the water from the Deuterium using specially designed centrifuges. Upgrading the synthesizer increases the amount of Deuterium deposits processed. Deuterium is used when carrying out sensor phalanx scans, viewing galaxies, as fuel for ships, and performing specialized research upgrades.
items.SOLAR_PLANT.name=Solar Plant
items.SOLAR_PLANT.description=Gigantic solar arrays are used to generate power for the mines and the deuterium synthesizer. As the solar plant is upgraded, the surface area of the photovoltaic cells covering the planet increases, resulting in a higher energy output across the power grids of your planet.
items.FUSION_REACTOR.name=Fusion Reactor
items.FUSION_REACTOR.description=In fusion power plants, hydrogen nuclei are fused into helium nuclei under enormous temperature and pressure, releasing tremendous amounts of energy. For each gram of Deuterium consumed, up to 41.32*10^-13 Joules of energy can be produced; with 1 g you are able to produce 172 MWh of energy.\n\nLarger reactor complexes use more deuterium and can produce more energy per hour. The energy effect can be increased by researching energy technology.\n\nThe energy production of the fusion plant is calculated as follows\: 30 * [Level Fusion Plant] * (1.05 + [Level Energy Technology] * 0.01) ^ [Level Fusion Plant]
items.ROBOTICS_FACTORY.name=Robotics Factory
items.ROBOTICS_FACTORY.description=The Robotics Factory's primary goal is the production of state-of-the-art construction robots. Each upgrade to the robotics factory results in the production of faster robots, which are used to reduce the time needed to construct buildings.
items.NANITE_FACTORY.name=Nanite Factory
items.NANITE_FACTORY.description=A nanomachine, also called a nanite, is a mechanical or electromechanical device whose dimensions are measured in nanometers (millionths of a millimeter, or units of 10^-9 meter). The microscopic size of nanomachines translates into higher operational speed. This factory produces nanomachines that are the ultimate evolution in robotics technology. Once constructed, each upgrade significantly decreases production time for buildings, ships, and defensive structures.
items.SHIPYARD.name=Shipyard
items.SHIPYARD.description=The planetary shipyard is responsible for the construction of spacecraft and defensive mechanisms. As the shipyard is upgraded, it can produce a wider variety of vehicles at a much greater rate of speed. If a nanite factory is present on the planet, the speed at which ships are constructed is massively increased.
items.METAL_STORAGE.name=Metal Storage
items.METAL_STORAGE.description=This giant storage facility is used to store metal ore. Each level of upgrading increases the amount of metal ore that can be stored. If the stores are full, no further metal will be mined.\n\nThe Metal Storage protects a certain percentage of the mine's daily production (max. 10 percent).
items.CRYSTAL_STORAGE.name=Crystal Storage
items.CRYSTAL_STORAGE.description=The unprocessed crystal will be stored in these giant storage halls in the meantime. With each level of upgrade, the amount of crystal that can be stored increases. If the crystal stores are full, no further crystal will be mined.\n\nThe Crystal Storage protects a certain percentage of the mine's daily production (max. 10 percent).
items.DEUTERIUM_TANK.name=Deuterium Tank
items.DEUTERIUM_TANK.description=The Deuterium tank is for storing newly synthesized deuterium. Once it is processed by the synthesizer, it is piped into this tank for later use. With each upgrade of the tank, the total storage capacity is increased. Once the capacity is reached, no further Deuterium will be synthesized.\n\nThe Deuterium Tank protects a certain percentage of the synthesizer's daily production (max. 10 percent).
items.RESEARCH_LAB.name=Research Lab
items.RESEARCH_LAB.description=An essential part of any empire, Research Labs are where new technologies are discovered and older technologies are improved upon. With each level of the Research Lab constructed, the speed at which new technologies are researched is increased, while also unlocking newer technologies to research. In order to conduct research as quickly as possible, research scientists are immediately dispatched to the colony to begin work and development. In this way, knowledge about new technologies can easily be disseminated throughout the empire.
items.TERRAFORMER.name=Terraformer
items.TERRAFORMER.description=With increasing construction on planets, even the living space for the colony is becoming more and more limited. Traditional methods such as high-rise and underground construction are increasingly becoming insufficient. A small group of high-energy physicists and nanoengineers eventually came to the solution\: terraforming.\nMaking use of tremendous amounts of energy, the terraformer can make whole stretches of land or even continents arable. This building houses the production of nanites created specifically for this purpose, which ensure consistent ground quality throughout.\n\nEach terraformer level allows 5 fields to be cultivated. With each level, the terraformer occupies one field itself. Every 2 terraformer levels you will receive 1 bonus field.\n\nOnce built, the terraformer cannot be dismantled.
items.ALLIANCE_DEPOT.name=Alliance Depot
items.ALLIANCE_DEPOT.description=The alliance depot supplies fuel to friendly fleets in orbit, helping with defense. For each upgrade level of the alliance depot, a special demand of deuterium per hour can be sent to an orbiting fleet.
items.LUNAR_BASE.name=Lunar Base
items.LUNAR_BASE.description=A moon has no atmosphere, so a lunar base must first be built before a settlement can be set up. This then provides oxygen, heating, and gravity. With each level constructed, a larger living and development area is provided within the biosphere. Each constructed level allows three fields for other buildings. With each level, the Lunar base occupies one field itself.\nOnce built, the lunar base cannot be torn down.
items.SENSOR_PHALANX.name=Sensor Phalanx
items.SENSOR_PHALANX.description=Utilizing high-resolution sensors, the Sensor Phalanx first scans the spectrum of light, composition of gases, and radiation emissions from a distant world and transmits the data to a supercomputer for processing. Once the information is obtained, the supercomputer compares changes in the spectrum, gas composition, and radiation emissions to a baseline chart of known changes in the spectrum created by various ship movements. The resulting data then displays activity of any fleet within the range of the phalanx. To prevent the supercomputer from overheating during the process, it is cooled by utilizing 5k of processed Deuterium.\nTo use the Phalanx, click on any planet in the Galaxy View within your sensor's range.
items.JUMP_GATE.name=Jump Gate
items.JUMP_GATE.description=A Jump Gate is a system of giant transceivers capable of sending even the largest fleets to a receiving Gate anywhere in the universe without loss of time. Utilizing technology similar to that of a Worm Hole to achieve the jump, deuterium is not required. A recharge period of a few minutes must pass between jumps to allow for regeneration. Transporting resources through the Gate is not possible either. With every upgrade level the jump gate's cooldown time can be reduced.
items.MISSILE_SILO.name=Missile Silo
items.MISSILE_SILO.description=Missile silos are used to construct, store, and launch interplanetary and anti-ballistic missiles. With each level of the silo, five interplanetary missiles or ten anti-ballistic missiles can be stored. One Interplanetary missile uses the same space as two Anti-Ballistic missiles. Storage of both Interplanetary missiles and Anti-Ballistic missiles in the same silo is allowed.
# Technologies
items.ESPIONAGE_TECHNOLOGY.name=Espionage Technology
items.ESPIONAGE_TECHNOLOGY.description=Espionage Technology is, in the first instance, an advancement of sensor technology. The more advanced this technology is, the more information the user receives about activities in their environment.\nThe difference between your own spy level and opposing spy levels is crucial for probes. The more advanced your own espionage technology is, the more information the report can gather and the smaller the chance that your espionage activities are discovered. The more probes you send on one mission, the more details they can gather from the target, but this also increases the chance of discovery.\nEspionage technology also improves the chance of locating foreign fleets. From level 2 onward, the exact total number of attacking ships is displayed. From level 4 onward, the types of attacking ships are shown, and from level 8 onward, the exact number of each ship type is shown.\nThis technology is indispensable for an upcoming attack, as it informs you whether the victim fleet has defense available. That is why this technology should be researched very early on.
items.COMPUTER_TECHNOLOGY.name=Computer Technology
items.COMPUTER_TECHNOLOGY.description=Once launched on any mission, fleets are controlled primarily by a series of computers located on the originating planet. These massive computers calculate the exact time of arrival, control course corrections as needed, calculate trajectories, and regulate flight speeds.\nWith each level researched, the flight computer is upgraded to allow an additional fleet slot to be launched. Computer technology should be continuously developed throughout the building of your empire.
items.WEAPONS_TECHNOLOGY.name=Weapons Technology
items.WEAPONS_TECHNOLOGY.description=Weapons Technology is a key research technology and is critical to your survival against enemy Empires. With each level of Weapons Technology researched, the weapons systems on ships and your defense mechanisms become increasingly more efficient. Each level increases the base strength of your weapons by 10% of the base value.
items.SHIELDING_TECHNOLOGY.name=Shielding Technology
items.SHIELDING_TECHNOLOGY.description=With the invention of the magnetosphere generator, scientists learned that an artificial shield could be produced to protect the crew in spaceships not only from the harsh solar radiation environment in deep space, but also from enemy fire during an attack. Once scientists finally perfected the technology, a magnetosphere generator was installed on all ships and defense systems.\n\nAs the technology is advanced to each level, the magnetosphere generator is upgraded, providing an additional 10% strength to the shield's base value.
items.ARMOR_TECHNOLOGY.name=Armor Technology
items.ARMOR_TECHNOLOGY.description=The environment of deep space is harsh. Pilots and crew on various missions not only faced intense solar radiation, they also faced the prospect of being hit by space debris or destroyed by enemy fire in an attack. With the discovery of an aluminum-lithium titanium carbide alloy, which was found to be both lightweight and durable, the crew was afforded a certain degree of protection. With each level of Armor Technology developed, a higher quality alloy is produced, which increases the armor's strength by 10%.
items.ENERGY_TECHNOLOGY.name=Energy Technology
items.ENERGY_TECHNOLOGY.description=As various fields of research advanced, it was discovered that the current technology of energy distribution was not sufficient to begin certain specialized research. With each upgrade of your Energy Technology, new research can be conducted which unlocks the development of more sophisticated ships and defenses.
items.HYPERSPACE_TECHNOLOGY.name=Hyperspace Technology
items.HYPERSPACE_TECHNOLOGY.description=In theory, the idea of hyperspace travel relies on the existence of a separate and adjacent dimension. When activated, a hyperspace drive shunts the starship into this other dimension, where it can cover vast distances in an amount of time greatly reduced from the time it would take in "normal" space. Once it reaches the point in hyperspace that corresponds to its destination in real space, it re-emerges.\nOnce a sufficient level of Hyperspace Technology is researched, the Hyperspace Drive is no longer just a theory. Each improvement to this drive increases the load capacity of your ships by 5% of the base value.
items.HYPERSPACE_TECHNOLOGY.description.extra=In addition, the art of folding space onto itself allows for more efficient storage of cargo in spacetime continuum, making the ships effectively bigger on the inside. Because of that, each level increases cargo capacity of all ships by {0}%.
items.COMBUSTION_DRIVE.name=Combustion Drive
items.COMBUSTION_DRIVE.description=The Combustion Drive is the oldest of technologies, but is still in use. With the Combustion Drive, exhaust is formed from propellants carried within the ship prior to use. In a closed chamber, the pressures are equal in each direction and no acceleration occurs. If an opening is provided at the bottom of the chamber, the pressure is no longer opposed on that side. The remaining pressure gives a resultant thrust in the side opposite the opening, which propels the ship forward by expelling the exhaust rearward at extremely high speed.\n\nWith each level of the Combustion Drive developed, the speed of small and large cargo ships, light fighters, recyclers, and espionage probes is increased by 10%.
items.IMPULSE_DRIVE.name=Impulse Drive
items.IMPULSE_DRIVE.description=The impulse drive is based on the recoil principle, by which the stimulated emission of radiation is mainly produced as a waste product from core fusion to gain energy. Additionally, other masses can be injected. With each level of the Impulse Drive developed, the speed of bombers, cruisers, heavy fighters, and colony ships is increased by 20% of the base value. Additionally, small transporters are fitted with impulse drives as soon as research reaches level 5. As soon as Impulse Drive research reaches level 17, Recyclers are refitted with Impulse Drives.\n\nInterplanetary missiles also travel farther with each level.
items.HYPERSPACE_DRIVE.name=Hyperspace Drive
items.HYPERSPACE_DRIVE.description=In the immediate vicinity of the ship, space is warped so that long distances can be covered very quickly. The more the Hyperspace Drive is developed, the stronger the warped nature of space, whereby the speed of ships equipped with it (Battlecruisers, Battleships, Destroyers, Death Stars, Pathfinders, and Reapers) increases by 30% per level. Additionally, the bomber is built with a Hyperspace Drive as soon as research reaches level 8. As soon as Hyperspace Drive research reaches level 15, the Recycler is refitted with a Hyperspace Drive.
items.LASER_TECHNOLOGY.name=Laser Technology
items.LASER_TECHNOLOGY.description=Lasers (light amplification by stimulated emission of radiation) produce an intense, energy-rich emission of coherent light. These devices can be used in all sorts of areas, from optical computers to heavy laser weapons, which effortlessly cut through armor technology. Laser technology provides an important basis for research into other weapon technologies.
items.LASER_TECHNOLOGY.description.extra=On top of its military application, laser technology improved the transfer of energy from orbital solar satellites to the ground stations tremendously. Each level increases Solar Satellite efficiency by {0}%.
items.ION_TECHNOLOGY.name=Ion Technology
items.ION_TECHNOLOGY.description=Ions can be concentrated and accelerated into a deadly beam. These beams can then inflict enormous damage. Our scientists have also developed a technique that will clearly reduce the deconstruction costs for buildings and systems. For each research level, deconstruction costs will decrease by 4%.
items.PLASMA_TECHNOLOGY.name=Plasma Technology
items.PLASMA_TECHNOLOGY.description=A further development of ion technology that does not accelerate ions, but high-energy plasma instead, which can then inflict devastating damage on impact with an object. Our scientists have also found a way to noticeably improve the mining of metal and crystal using this technology.\n\nMetal production increases by 1%, crystal production by 0.66%, and deuterium production by 0.33% per research level of plasma technology.
items.INTERGALACTIC_RESEARCH_NETWORK.name=Intergalactic Research Network
items.INTERGALACTIC_RESEARCH_NETWORK.description=This is your deep space network for communicating research results to your colonies. With the IRN, faster research times can be achieved by linking the highest-level research labs equal to the level of the IRN developed.\nIn order to function, each colony must be able to conduct the research independently.
items.ASTROPHYSICS.name=Astrophysics
items.ASTROPHYSICS.description=Further findings in the field of astrophysics allow for the construction of laboratories that can be fitted on more and more ships. This makes long expeditions far into unexplored areas of space possible. In addition, these advancements can be used to further colonize the universe. For every two levels of this technology, an additional planet can be made usable.
items.GRAVITON_TECHNOLOGY.name=Graviton Technology
items.GRAVITON_TECHNOLOGY.description=A graviton is an elementary particle that is massless and has no charge. It determines gravitational power. By firing a concentrated load of gravitons, an artificial gravitational field can be constructed. Not unlike a black hole, it draws mass into itself. Thus it can destroy ships and even entire moons. To produce a sufficient amount of gravitons, huge amounts of energy are required. Graviton Research is required to construct a destructive Death Star.
# Units
items.SMALL_CARGO.name=Small Cargo
items.SMALL_CARGO.abbreviation=SC
items.SMALL_CARGO.description=Transporters are about as large as fighters, yet they forego high-performance drives and onboard weaponry for gains in their freight capacity. As a result, a transporter should only be sent into battles when accompanied by combat-ready ships.\n\nAs soon as the Impulse Drive reaches research level 5, the small transporter travels with increased base speed and is equipped with an Impulse Drive.
items.LARGE_CARGO.name=Large Cargo
items.LARGE_CARGO.abbreviation=LC
items.LARGE_CARGO.description=As time evolved, raids on colonies resulted in larger and larger amounts of resources being captured. As a result, Small Cargos were sent out in large numbers to compensate for the larger captures. It was quickly learned that a new class of ship was needed to maximize resources captured in raids while remaining cost-effective. After much development, the Large Cargo was born.\n\nTo maximize the resources that can be stored in the holds, this ship has little in the way of weapons or armor. Thanks to its highly developed combustion engine, it serves as the most economical resource supplier between planets and is highly effective in raids on hostile worlds.
items.LITTLE_FIGHTER.name=Little Fighter
items.LITTLE_FIGHTER.abbreviation=LF
items.LITTLE_FIGHTER.description=This is the first fighting ship all emperors will build. The light fighter is an agile ship, but vulnerable when it is on its own. In large numbers, they can become a great threat to any empire. They are the first to accompany small and large cargo ships to hostile planets with minor defenses.
items.HEAVY_FIGHTER.name=Heavy Fighter
items.HEAVY_FIGHTER.abbreviation=HF
items.HEAVY_FIGHTER.description=In developing the heavy fighter, researchers reached a point at which conventional drives no longer provided sufficient performance. In order to move the ship optimally, the impulse drive was used for the first time. This increased costs, but also opened new possibilities. By using this drive, more energy was left for weapons and shields; in addition, high-quality materials were used for this new family of fighters. With these changes, the heavy fighter represents a new era in ship technology and is the basis for cruiser technology.\n\nSlightly larger than the light fighter, the heavy fighter has a thicker hull, providing more protection, and stronger weaponry.
items.CRUISER.name=Cruiser
items.CRUISER.abbreviation=CR
items.CRUISER.description=With the development of the heavy laser and ion cannon, light and heavy fighters encountered an alarmingly high number of defeats. Despite many modifications to weapon strength and armor, they could not be improved fast enough to effectively counter these new defensive measures. Therefore, a new class of ship combining more armor and firepower was built\: the Cruiser.\n\nCruisers are armored almost three times as heavily as heavy fighters and possess more than twice their firepower. They also possess speeds that far surpass earlier spacecraft. For almost a century, cruisers dominated the universe. However, with the development of Gauss cannons and plasma turrets, their predominance ended. They are still used today against fighter groups, but not as predominantly as before.
items.BATTLESHIP.name=Battleship
items.BATTLESHIP.abbreviation=BS
items.BATTLESHIP.description=Once it became apparent that the cruiser was losing ground to the increasing number of defense structures it faced, and with mission losses at unacceptable levels, it was decided to build a ship that could face those same defense structures with as little loss as possible. After extensive development, the Battleship was born. Built to withstand the largest battles, the Battleship features large cargo spaces, heavy cannons, and high hyperspace-drive speed. Once developed, it became the backbone of every raiding Emperor's fleet.
items.COLONY_SHIP.name=Colony Ship
items.COLONY_SHIP.abbreviation=CS
items.COLONY_SHIP.description=In the 20th century, humanity decided to reach for the stars. First came the Moon landing, then a space station, followed by the colonization of Mars. It was soon determined that growth depended on colonizing other worlds. Scientists and engineers all over the world gathered to develop humanity's greatest achievement\: the Colony Ship.\n\nThis ship is used to prepare a newly discovered planet for colonization. Once it arrives, the ship is instantly transformed into habitable living space to assist in populating and mining the new world. The maximum number of planets is determined by progress in astrophysics research. Two new levels of Astrophysics allow for the colonization of one additional planet.
items.RECYCLER.name=Recycler
items.RECYCLER.abbreviation=REC
items.RECYCLER.description=Combat in space took on ever larger scales. Thousands of ships were destroyed, and the resources in their remains seemed lost to debris fields forever. Normal cargo ships could not get close enough to these fields without risking substantial damage. A recent development in shield technologies solved this issue. A new class of ship similar to the Transporters was created\: the Recycler. Its efforts recovered the resources believed lost and salvaged them. The debris no longer posed any real danger thanks to the new shields.\n\nAs soon as Impulse Drive research reaches level 17, Recyclers are refitted with Impulse Drives. As soon as Hyperspace Drive research reaches level 15, Recyclers are refitted with Hyperspace Drives.
items.ESPIONAGE_PROBE.name=Espionage Probe
items.ESPIONAGE_PROBE.abbreviation=EP
items.ESPIONAGE_PROBE.description=Espionage probes are small, agile drones that provide data on fleets and planets. Fitted with specially designed engines, they can cover vast distances in only a few minutes. Once in orbit around the target planet, they quickly collect data and transmit the report back through your Deep Space Network for evaluation. However, intelligence gathering carries a risk. While the report is transmitted, the signal can be detected by the target and the probes can be destroyed.
items.BOMBER.name=Bomber
items.BOMBER.abbreviation=BB
items.BOMBER.description=Over the centuries, as defenses became larger and more sophisticated, fleets were destroyed at an alarming rate. A new ship was needed to break defenses and ensure maximum results. After years of research and development, the Bomber was created.\n\nUsing laser-guided targeting equipment and Plasma Bombs, the Bomber seeks out and destroys any defense mechanism it can find. As soon as the Hyperspace Drive is developed to level 8, the Bomber is retrofitted with the hyperspace engine and can fly at higher speeds.
items.SOLAR_SATELLITE.name=Solar Satellite
items.SOLAR_SATELLITE.abbreviation=SS
items.SOLAR_SATELLITE.description=Scientists discovered a method of transmitting electrical energy to the colony using specially designed satellites in geosynchronous orbit. Solar Satellites gather solar energy and transmit it to a ground station using advanced laser technology. Their efficiency depends on the strength of the solar radiation received. In principle, energy production in orbits closer to the sun is greater than for planets farther away.\nDue to their good cost-performance ratio, solar satellites can solve many energy problems. But beware\: Solar Satellites can be easily destroyed in battle.
items.DESTROYER.name=Destroyer
items.DESTROYER.abbreviation=D
items.DESTROYER.description=The Destroyer is the result of years of work and development. With the development of Death Stars, a class of ship was needed to defend against such a massive weapon. Thanks to its improved homing sensors, multi-phalanx ion cannons, Gauss cannons, and plasma turrets, the Destroyer became one of the most fearsome ships ever created.\n\nBecause the destroyer is very large, its maneuverability is severely limited, making it more of a battle station than a fighting ship. Its lack of maneuverability is offset by sheer firepower, but it also costs significant amounts of deuterium to build and operate.
items.DEATH_STAR.name=Death Star
items.DEATH_STAR.abbreviation=DS
items.DEATH_STAR.description=The Death Star is the most powerful ship ever created. This moon-sized ship is the only ship that can be seen with the naked eye from the ground. By the time you spot it, unfortunately, it is too late to do anything.\n\nArmed with a gigantic graviton cannon, the most advanced weapons system ever created in the Universe, this massive ship can destroy entire fleets and defenses, as well as entire moons. Only the most advanced empires can build a ship of this mammoth size.
items.BATTLE_CRUISER.name=Battlecruiser
items.BATTLE_CRUISER.abbreviation=BC
items.BATTLE_CRUISER.description=This ship is one of the most advanced fighting ships ever developed and is particularly deadly when destroying attacking fleets. With improved laser cannons onboard and an advanced Hyperspace engine, the Battlecruiser is a serious force in any attack. Due to the ship's design and large weapons system, cargo capacity had to be reduced, but this is compensated for by lower fuel consumption.
items.ROCKET_LAUNCHER.name=Rocket Launcher
items.ROCKET_LAUNCHER.abbreviation=RL
items.ROCKET_LAUNCHER.description=Your first basic line of defense. These simple ground-based launch facilities fire conventional warhead-tipped missiles at attacking enemy targets. As they are cheap to construct and require no research, they are well suited for defending against raids, but lose effectiveness against larger-scale attacks. Once more advanced defense systems are constructed, Rocket Launchers become fodder that allows more damaging weapons to inflict damage for longer.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.LIGHT_LASER.name=Light Laser
items.LIGHT_LASER.abbreviation=LL
items.LIGHT_LASER.description=As technology developed and more sophisticated ships were created, a stronger line of defense was needed. As Laser Technology advanced, a new weapon was designed. Light Lasers are simple ground-based weapons that use special targeting systems to track the enemy and fire a high-intensity laser designed to cut through the target's hull. To remain cost-effective, they were fitted with an improved shielding system, while their structural integrity remains the same as that of the Rocket Launcher.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.HEAVY_LASER.name=Heavy Laser
items.HEAVY_LASER.abbreviation=HL
items.HEAVY_LASER.description=The Heavy Laser is a practical, improved version of the Light Laser. More balanced than the Light Laser, with an improved alloy composition, it uses stronger, more densely packed beams and better onboard targeting systems.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.GAUSS_CANNON.name=Gauss Cannon
items.GAUSS_CANNON.abbreviation=GC
items.GAUSS_CANNON.description=For a long time, projectile weapons were regarded as antiquated in the wake of modern thermonuclear and energy technology, the development of hyperdrive, and improved armor. Then the same energy technology that had made them obsolete helped them regain their established position.\nA Gauss cannon is a large version of the particle accelerator. Extremely heavy projectiles are accelerated by enormous electromagnetic force to muzzle velocities that make the dirt surrounding them burn in the sky. The weapon is so powerful that firing it creates a sonic boom. Modern armor and shields can barely withstand the force, and the target is often completely penetrated. Defense structures deactivate as soon as they are too badly damaged.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.ION_CANNON.name=Ion Cannon
items.ION_CANNON.abbreviation=IC
items.ION_CANNON.description=An ion cannon fires beams of ions, which are positively or negatively charged particles. The Ion Cannon is a type of particle cannon; only the particles used are ionized. Due to their electrical charges, they can disable electronic devices and anything else with an electrical or similar power source through an electromagnetic pulse (EMP). The cannon's highly improved shielding system also provides protection for larger, more destructive defense weapons.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.PLASMA_TURRET.name=Plasma Turret
items.PLASMA_TURRET.abbreviation=PT
items.PLASMA_TURRET.description=One of the most advanced defense weapon systems ever developed, the Plasma Turret uses a large nuclear reactor fuel cell to power an electromagnetic accelerator that fires a pulse, or toroid, of plasma. During operation, the turret locks onto a target and begins firing. A plasma sphere is created in the turret's core by superheating and compressing gases, stripping them of their electrons. It is then loaded into and launched by the electromagnetic accelerator at extremely high speed. From the target's perspective, the approaching bluish ball of plasma is impressive, but once it strikes, it causes instant destruction.\n\nDefensive facilities deactivate as soon as they are too heavily damaged. After a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.SMALL_SHIELD_DOME.name=Small Shield Dome
items.SMALL_SHIELD_DOME.abbreviation=SSD
items.SMALL_SHIELD_DOME.description=Colonizing new worlds brought a new danger\: space debris. A large asteroid could easily wipe out a world and its inhabitants. Advances in shielding technology allowed scientists to develop a shield protecting an entire planet from both space debris and enemy attacks. By creating a large electromagnetic field around the planet, debris was deflected and attacks were thwarted. The first generators were large and provided moderate protection, but small shields proved insufficient against larger-scale attacks. The small shield dome was the prelude to a stronger planetary shielding system.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.LARGE_SHIELD_DOME.name=Large Shield Dome
items.LARGE_SHIELD_DOME.abbreviation=LSD
items.LARGE_SHIELD_DOME.description=The Large Shield Dome is the next step in planetary shield development and the result of years spent improving the Small Shield Dome. Built to withstand a larger barrage of enemy fire by providing a more highly energized electromagnetic field, large domes provide protection for longer before collapsing.\n\nAfter a battle, there is up to a 70% chance that failed defensive facilities can be returned to use.
items.ANTI_BALLISTIC_MISSILE.name=Anti-ballistic Missile
items.ANTI_BALLISTIC_MISSILE.description=Anti-Ballistic Missiles (ABMs) are your only line of defense when Interplanetary Missiles (IPMs) attack your planet or moon. When incoming IPMs are detected, these missiles automatically arm, process a launch code in their flight computers, target the inbound missiles, and launch to intercept. During flight, the target is constantly tracked and course corrections are applied until the ABM reaches and destroys it. Each ABM destroys one incoming IPM.
items.ANTI_BALLISTIC_MISSILE.abbreviation=ABM
items.INTERPLANETARY_MISSILE.name=Interplanetary Missile
items.INTERPLANETARY_MISSILE.abbreviation=IPM
items.INTERPLANETARY_MISSILE.description=Interplanetary Missiles (IPMs) are offensive weapons used to destroy a target's defenses. Using state-of-the-art tracking technology, each missile targets a certain number of defenses for destruction. Tipped with an antimatter bomb, they deliver a destructive force so severe that destroyed shields and defenses cannot be repaired. The only way to counter these missiles is with ABMs.
