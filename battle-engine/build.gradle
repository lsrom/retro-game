plugins {
  id 'java-library'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'me.champeau.jmh' version '0.7.3'
}

group = 'com.github.retro_game'
version = rootProject.version
description = 'Retro Game Battle Engine'

dependencyManagement {
  imports {
    mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.14'
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.14'
  implementation 'org.springframework:spring-context'
  implementation 'org.springframework:spring-core'

  testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.14'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 21
}

def battleEngineBuildDir = layout.buildDirectory.dir('native')

tasks.register('configureBattleEngine', Exec) {
  description = 'Configures the native battle engine CMake build.'
  group = 'build'
  inputs.file('src/main/cpp/CMakeLists.txt')
  inputs.file('src/main/cpp/BattleEngine.cpp')
  outputs.dir(battleEngineBuildDir)
  commandLine 'cmake',
      '-S', 'src/main/cpp',
      '-B', battleEngineBuildDir.get().asFile.absolutePath,
      '-DCMAKE_BUILD_TYPE=Release'
}

tasks.register('buildBattleEngine', Exec) {
  description = 'Builds the native battle engine shared library.'
  group = 'build'
  dependsOn 'configureBattleEngine'
  inputs.file('src/main/cpp/CMakeLists.txt')
  inputs.file('src/main/cpp/BattleEngine.cpp')
  inputs.dir(battleEngineBuildDir)
  outputs.file(battleEngineBuildDir.map { it.file(System.mapLibraryName('BattleEngine')) })
  commandLine 'cmake',
      '--build', battleEngineBuildDir.get().asFile.absolutePath,
      '--config', 'Release'
}

tasks.named('test') {
  useJUnitPlatform()
  enableAssertions = true
  systemProperty 'retro-game.native-tests', System.getProperty('retro-game.native-tests', 'false')

  if (System.getProperty('retro-game.native-tests') == 'true') {
    dependsOn 'buildBattleEngine'
    systemProperty 'java.library.path', battleEngineBuildDir.get().asFile.absolutePath
  }
}

jmh {
  fork = 1
  warmupIterations = 3
  iterations = 5
  timeOnIteration = '1s'
  resultFormat = 'JSON'
}
